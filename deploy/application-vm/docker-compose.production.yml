name: kit-operator-statuses

services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_HTTP_PORT:-8080}:80"
    networks:
      - ingress
      - app

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
    networks:
      - app
      - data

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

volumes:
  postgres_data:
  redis_data:

networks:
  ingress:
  app:
    internal: true
  data:
    internal: true
